name: Cloud sidecar regression characterization
on:
  pull_request:
    paths:
      - 'cloud-controller/**'
      - '.github/workflows/cloud-sidecar.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shared-and-native:
    env:
      COPPERTOP_INSTALL_COMMAND: npm ci --ignore-scripts
    name: '${{ matrix.package }} controls and regression characterization'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [shared, lane-a]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: 'cloud-controller/${{ matrix.package }}/package-lock.json'
      - name: Install isolated locked dependencies
        working-directory: 'cloud-controller/${{ matrix.package }}'
        run: npm ci --ignore-scripts
      - name: Strict typecheck
        working-directory: 'cloud-controller/${{ matrix.package }}'
        run: npm run typecheck
      - name: Compiler hygiene
        working-directory: 'cloud-controller/${{ matrix.package }}'
        run: npm run lint
      - name: Shared domain and independent-provider tests
        if: matrix.package == 'shared'
        working-directory: cloud-controller/shared
        env:
          COPPERTOP_TEST_COMMAND: npm test (cloud-controller/shared)
        run: npm test
      - name: Native controls and expected local recovery gaps
        if: matrix.package == 'lane-a'
        working-directory: cloud-controller/lane-a
        env:
          COPPERTOP_TEST_COMMAND: npm run test:characterize
        run: npm run test:characterize
  upstream:
    env:
      COPPERTOP_INSTALL_COMMAND: bash cloud-controller/lane-b/setup.sh (filtered frozen pnpm 11.20.0)
    name: Upstream controls and known recovery regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Install exact upstream workspace with frozen lock and patches
        run: bash cloud-controller/lane-b/setup.sh
      - name: Build relevant workspace packages
        working-directory: .local/upstream/effect
        run: node node_modules/typescript/lib/tsc.js -b packages/platform/cloudflare/tsconfig.json
      - name: Complete Effect Babel build
        working-directory: .local/upstream/effect/packages/effect
        run: node ../../node_modules/@babel/cli/bin/babel.js dist --plugins annotate-pure-calls --out-dir dist --source-maps
      - name: Complete SQLite DO Babel build
        working-directory: .local/upstream/effect/packages/sql/sqlite-do
        run: node ../../../node_modules/@babel/cli/bin/babel.js dist --plugins annotate-pure-calls --out-dir dist --source-maps
      - name: Complete Cloudflare Babel build
        working-directory: .local/upstream/effect/packages/platform/cloudflare
        run: node ../../../node_modules/@babel/cli/bin/babel.js dist --plugins annotate-pure-calls --out-dir dist --source-maps
      - name: Strict fixture typecheck
        run: bash cloud-controller/lane-b/run.sh --typecheck
      - name: Targeted fixture lint
        working-directory: .local/upstream/effect
        run: node node_modules/oxlint/bin/oxlint --config .oxlintrc.json packages/platform/cloudflare/test/integration/coppertop/worker.ts
      - name: Existing upstream Workflow controls
        working-directory: .local/upstream/effect
        run: node node_modules/vitest/vitest.mjs run packages/platform/cloudflare/test/integration/Workflow.test.ts packages/platform/cloudflare/test/CloudflareWorkflowEngine.test.ts
      - name: Characterize controls and two known engine failures
        run: bash cloud-controller/lane-b/run.sh

  managed-canary:
    name: Managed canary local controls and packaging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
          cache: npm
          cache-dependency-path: |
            cloud-controller/lane-a/package-lock.json
            cloud-controller/managed-canary/package-lock.json
      - name: Install pinned persisted codecs and managed package
        run: |
          npm ci --prefix cloud-controller/lane-a --ignore-scripts
          npm ci --prefix cloud-controller/managed-canary --ignore-scripts
      - name: Typecheck, compiler hygiene and bounded local controls
        working-directory: cloud-controller/managed-canary
        run: npm run check
      - name: Package private Workers and deletion migration without upload
        working-directory: cloud-controller/managed-canary
        run: npm run package -- ct-ci-native-canary ../../.local/managed-canary-ci
