name: CPU tests
on:
  push:
    branches: [main]
    paths-ignore: &prose ["**.md", "docs/**"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, labeled, unlabeled]
    paths-ignore: *prose
permissions:
  contents: read
# A newer commit on the same PR or branch cancels the in-flight run.
concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    # Draft PRs, and PRs labelled local-verified (checks already passed locally), skip.
    if: >-
      github.event_name != 'pull_request' || (!github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'local-verified'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          # Caches downloaded wheels (CPU torch is most of the install time). The key includes
          # this file because the torch, Pillow, packaging and requests pins live here.
          cache: pip
          cache-dependency-path: |
            .github/workflows/cpu-tests.yml
            pyproject.toml
            requirements-gpu-controller.txt
            requirements-r2.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . Pillow==12.3.0 packaging==26.3 requests==2.34.2 -r requirements-gpu-controller.txt -r requirements-r2.txt
      - name: Run unit tests without models or datasets
        run: python -m unittest discover -s tests -v
